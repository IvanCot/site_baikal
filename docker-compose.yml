services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baikal}
      POSTGRES_USER: ${POSTGRES_USER:-baikal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Создайте .env через scripts/setup_env.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      USE_SQLITE: 'False'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - documents:/app/media
      - static_files:/app/staticfiles
    healthcheck:
      test: [CMD, python, -c, 'import socket; s = socket.create_connection(("127.0.0.1", 8000), 3); s.close()']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports:
      - '${APP_PORT:-8080}:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  documents:
  static_files:
