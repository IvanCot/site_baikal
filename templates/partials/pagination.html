{% if page.paginator.num_pages > 1 %}<div class="pagination">{% if page.has_previous %}<a class="btn small" href="{% querystring page=page.previous_page_number %}">← Назад</a>{% endif %}<span>Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="btn small" href="{% querystring page=page.next_page_number %}">Вперёд →</a>{% endif %}</div>{% endif %}
