{% if booking.status == 'reserved' %}<form method="post" action="{% url 'booking_action' booking.pk 'checkin' %}" data-confirm="Заселить гостя в номер {{ booking.room.name }}?">{% csrf_token %}<button class="btn small primary" type="submit"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M11 3h5v14h-5M3 10h9m-3-3 3 3-3 3"/></svg> Заселить</button></form>{% elif booking.status == 'occupied' %}<form method="post" action="{% url 'booking_action' booking.pk 'checkout' %}" data-confirm="Выселить гостя? Номер будет отмечен для уборки.">{% csrf_token %}<button class="btn small" type="submit"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M9 3H4v14h5m8-7H8m3-3-3 3 3 3"/></svg> Выселить</button></form>{% endif %}
