{% if booking.status == 'reserved' %}<form method="post" action="{% url 'booking_action' booking.pk 'checkin' %}" data-confirm="Заселить гостя в номер {{ booking.room.name }}?">{% csrf_token %}<button class="btn small primary" type="submit">Заселить ↗</button></form>{% elif booking.status == 'occupied' %}<form method="post" action="{% url 'booking_action' booking.pk 'checkout' %}" data-confirm="Выселить гостя? Номер будет отмечен для уборки.">{% csrf_token %}<button class="btn small" type="submit">Выселить ↗</button></form>{% endif %}
